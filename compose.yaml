services:
  train:
    build: .
    command: ["sh", "-c", "python scripts/make_demo_data.py && python -m recommender.train --data data/demo_movies.csv --promote --min-precision 0.8 --min-lift 0.1"]
    volumes:
      - model-store:/app/models
  api:
    build: .
    depends_on:
      train:
        condition: service_completed_successfully
    volumes:
      - model-store:/app/models:ro
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
  ui:
    build: .
    command: ["streamlit", "run", "app.py", "--server.address=0.0.0.0"]
    environment:
      API_URL: http://api:8000
      TMDB_API_KEY: ${TMDB_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8501:8501"
  prometheus:
    image: prom/prometheus:v3.4.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
volumes:
  model-store:
